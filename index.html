<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUANTUM // Cyberpunk Expense & Financial HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-scanlines"></div>

  <!-- Top Navigation Header -->
  <header class="hud-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-hex">Q</div>
        <div class="brand-titles">
          <h1>QUANTUM <span class="ver">v4.5</span></h1>
          <span class="sub">NEURAL FINANCIAL INTELLIGENCE HUD</span>
        </div>
      </div>

      <!-- Quick Metrics Bar -->
      <div class="hud-stats-strip">
        <div class="stat-pill">
          <span class="lbl">NET WORTH</span>
          <span class="val cyan" id="hud-net-worth">$0.00</span>
        </div>
        <div class="stat-pill">
          <span class="lbl">HEALTH SCORE</span>
          <span class="val green" id="hud-health-score">98/100</span>
        </div>
        <div class="stat-pill">
          <span class="lbl">AI CORE</span>
          <span class="val pink" id="hud-ai-status">ONLINE</span>
        </div>
      </div>

      <!-- User Controls -->
      <div class="header-actions">
        <select id="cur-select" class="hud-select">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="INR">INR (₹)</option>
          <option value="GBP">GBP (£)</option>
          <option value="BTC">BTC (₿)</option>
        </select>

        <button id="theme-btn" class="hud-btn-icon" title="Toggle Theme">⚡</button>
        <button id="ai-toggle-btn" class="hud-btn pink">🤖 AI COPILOT</button>
        <div id="sess-badge"></div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="hud-nav" id="main-nav"></nav>
  </header>

  <!-- Main View Container -->
  <main id="app-root" class="hud-container"></main>

  <!-- AI Copilot Panel (Drawer) -->
  <aside id="ai-drawer" class="ai-drawer">
    <div class="ai-header">
      <h3>NEURAL COPILOT INSIGHTS</h3>
      <button id="close-ai-btn" class="hud-btn-icon">✕</button>
    </div>
    <div class="ai-body">
      <div class="ai-status">
        <div class="ai-pulse"></div>
        <div>
          <strong style="color:var(--cyan); font-family:var(--font-hud);">Neural Predictive Engine</strong>
          <p style="margin:0; font-size:12px; color:var(--text-muted)">Real-time spending anomaly detection enabled.</p>
        </div>
      </div>
      <div id="ai-messages" class="ai-messages">
        <div class="msg bot">Operator, system systems normal. Your monthly savings velocity is up +18.4%.</div>
      </div>
      <div class="ai-input-box">
        <input type="text" id="ai-input" placeholder="Ask AI: e.g. 'Predict next month', 'Find anomalies'...">
        <button id="ai-send" class="hud-btn cyan">SEND</button>
      </div>
      <div class="ai-chips">
        <button class="chip" data-q="predict">🔮 Expense Prediction</button>
        <button class="chip" data-q="anomaly">⚠️ Detect Anomalies</button>
        <button class="chip" data-q="budget">🎯 Budget Advice</button>
      </div>
    </div>
  </aside>

  <!-- Global Modal Container -->
  <div id="hud-modal" class="hud-modal-bg"></div>

  <script src="script.js"></script>
</body>
</html>
